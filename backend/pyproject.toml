[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "planexus-geoengine"
version = "0.8.0"
description = "Evidence-first PLANEXUS AI geospatial screening API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9,<1",
  "rasterio>=1.4,<2",
  "numpy>=2.0,<3",
  "shapely>=2.0,<3",
  "pyproj>=3.6,<4",
  "httpx>=0.27,<1",
  "openai>=1.70,<3",
  "python-dotenv>=1.0,<2",
  "contourpy>=1.3,<2",
  "vercel==0.11.6"
]

[tool.setuptools]
packages = ["app"]
