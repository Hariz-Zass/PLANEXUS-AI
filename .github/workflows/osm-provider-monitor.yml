# Independent monitor for OPTIONAL public Overpass upstream health.
# It intentionally fails when third-party providers are offline, but does not
# make successful self-hosted PostGIS and GIS application builds red.
name: External OSM Provider Availability
on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:
jobs:
  public-overpass-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt
      - name: Query real public OSM around a nonprivate Malaysian reference site
        working-directory: backend
        run: python -m tests.live_site_context_smoke
      - name: Publish honest upstream provider status
        if: always()
        working-directory: backend
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("source_osm_live_evidence.json")
          x=json.loads(p.read_text()) if p.exists() else {"status":"diagnostic_missing"}
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("## Optional public OpenStreetMap provider status\n\n")
              f.write(f"**{'UP' if x.get('status')=='retrieved' else 'DOWN / UNAVAILABLE'}**\n\n")
              f.write("This does NOT indicate whether PLANEXUS private PostGIS is working.\n")
              f.write("The independent private PostGIS acceptance gate stays in Planexus V1 Validation.\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-overpass-availability-evidence
          path: backend/source_osm_live_evidence.json
          if-no-files-found: warn
