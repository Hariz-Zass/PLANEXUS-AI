name: Planexus V1 Validation
on:
  push:
  pull_request:
jobs:
  terrain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npm run lint:types
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  windows-launcher-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows PowerShell launcher scripts
        shell: pwsh
        run: |
          if (-not (Test-Path START-PLANEXUS.bat)) { throw 'Missing batch launcher' }
          Get-ChildItem scripts -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List | Out-String | Write-Host
              throw "PowerShell syntax error: $($_.Name)"
            }
          }

  map-persistence-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test --grep-invert @live-api
        working-directory: frontend

  live-cog-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true  # External S3 failures must be visible but not break offline algorithm checks.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Check real Copernicus public DEM tile and actual raster terrain calculations
        working-directory: backend
        run: python -m tests.live_cog_smoke

  docker-gis-volume-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Build the actual FastAPI GIS image (no cloud deploy)
        run: docker build -t planexus-gis:ci ./backend
      - name: Verify durable project data survives container replacement
        run: |
          set -euo pipefail
          trap 'docker ps -a; docker logs --tail 90 planexus-ci-api 2>/dev/null || true; docker logs --tail 90 planexus-ci-unmounted 2>/dev/null || true' ERR
          docker volume create planexus-ci-data
          docker run -d --name planexus-ci-api -p 127.0.0.1:18000:8000 -v planexus-ci-data:/data planexus-gis:ci
          python3 backend/tests/container_persistence_smoke.py wait
          python3 backend/tests/container_persistence_smoke.py create
          docker rm -f planexus-ci-api
          docker run -d --name planexus-ci-api -p 127.0.0.1:18000:8000 -v planexus-ci-data:/data planexus-gis:ci
          python3 backend/tests/container_persistence_smoke.py wait
          python3 backend/tests/container_persistence_smoke.py verify
          docker volume create planexus-ci-backups
          docker run --rm -v planexus-ci-data:/data -v planexus-ci-backups:/backups \
            planexus-gis:ci python -m app.backup_scheduler once \
            --data-dir /data --output-dir /backups --keep 2 --restore-drill
          docker run --rm -v planexus-ci-data:/data -v planexus-ci-backups:/backups \
            planexus-gis:ci python -m app.backup_scheduler status \
            --data-dir /data --output-dir /backups
          docker rm -f planexus-ci-api
          docker run -d --name planexus-ci-unmounted -p 127.0.0.1:18000:8000 planexus-gis:ci
          python3 backend/tests/container_persistence_smoke.py unmounted
      - name: Clean up isolated test containers and volume
        if: always()
        run: |
          docker rm -f planexus-ci-api planexus-ci-unmounted 2>/dev/null || true
          docker volume rm planexus-ci-data 2>/dev/null || true
          docker volume rm planexus-ci-backups 2>/dev/null || true

  real-gis-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real FastAPI, Rasterio and Next.js
        run: |
          python -m pip install -r backend/requirements.txt
          cd frontend && npm install --no-audit --no-fund
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Generate non-survey GeoTIFF and GeoJSON test fixtures
        working-directory: backend
        run: python tests/generate_browser_fixture.py ../frontend/tests/fixtures/generated
      - name: Start GIS API with isolated SQLite data
        run: |
          set -euo pipefail
          export PLANEXUS_DATA_DIR="$RUNNER_TEMP/planexus-integration-store"
          export PLANEXUS_REQUIRE_PERSISTENT_VOLUME=0
          cd backend
          # CI-only identity. Created through real auth service, no server bypass.
          python -c "from app.auth import create_user; from app.settings import DATA_DIR; create_user(DATA_DIR,'ci-planner@planexus.test','Synthetic GIS CI Planner','Synthetic-CI-2026-Private!',role='planner')"
          python -c "from app.auth import create_user,create_invite; from app.settings import DATA_DIR; from pathlib import Path; u=create_user(DATA_DIR,'ci-admin@planexus.test','Synthetic Invite Admin','Synthetic-Admin-CI-Private-2026!',role='admin'); Path('../frontend/tests/fixtures/generated/ci-invites.txt').write_text(chr(10).join(create_invite(DATA_DIR,u['email']) for _ in range(2)),encoding='utf-8')"
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/planexus-fastapi.log" 2>&1 &
          for n in $(seq 1 75); do
            if curl --fail --silent http://127.0.0.1:8000/api/health > /dev/null; then
              echo "FastAPI healthy; real API, isolated synthetic GIS fixture"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/planexus-fastapi.log"
          exit 1
      - name: Verify actual browser → API → GIS → SQLite workflow
        working-directory: frontend
        run: npx playwright test --grep @live-api
      - name: Surface API errors on failure
        if: failure()
        run: tail -n 150 "$RUNNER_TEMP/planexus-fastapi.log" || true

  gdal-horn-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native GDAL slope reference binary
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin
      - run: python -m pip install -r backend/requirements.txt
      - name: Independent Horn slope and NoData-mask comparison to GDAL
        working-directory: backend
        run: python -m tests.gdal_horn_reference
      - name: Publish audit results (synthetic, no project data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b3-3-gdal-reference
          path: backend/b3.3_gdal_reference_report.json
          if-no-files-found: ignore

  real-three-site-gis-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent GDAL CLI reference
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin
      - run: python -m pip install -r backend/requirements.txt
      - name: Test three REAL Malaysian public Copernicus COG sites, with no fabricated fallback
        working-directory: backend
        run: python -m tests.three_site_live_validation
      - name: Publish actual data-source/QA audit, even on S3 failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b3-3-malaysia-three-site-gis
          path: backend/b3.3_malaysia_live_report.json
          if-no-files-found: warn

  live-public-osm-context:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt
      - name: Verify real OSM source on public Malaysian reference square
        working-directory: backend
        run: python -m tests.live_site_context_smoke
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-osm-source-diagnostic
          path: backend/source_osm_live_evidence.json
          if-no-files-found: warn

  official-document-url-diagnostic:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt
      - name: Probe official GPP URL reachability only (NOT numeric rule verification)
        working-directory: backend
        run: python -m tests.official_source_reachability
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-gpp-url-diagnostic
          path: backend/official_source_reachability.json
          if-no-files-found: warn
