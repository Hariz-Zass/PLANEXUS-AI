name: Planexus V1 Validation
on:
  push:
  pull_request:
jobs:
  terrain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npm run lint:types
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  windows-launcher-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows PowerShell launcher scripts
        shell: pwsh
        run: |
          if (-not (Test-Path START-PLANEXUS.bat)) { throw 'Missing batch launcher' }
          Get-ChildItem scripts -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List | Out-String | Write-Host
              throw "PowerShell syntax error: $($_.Name)"
            }
          }

  map-persistence-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend

  live-cog-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true  # External S3 failures must be visible but not break offline algorithm checks.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Check real Copernicus public DEM tile and actual raster terrain calculations
        working-directory: backend
        run: python -m tests.live_cog_smoke
